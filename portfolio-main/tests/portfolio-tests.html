<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Test Suite — Senthamizhvelan M</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 24px; }
    h1 { font-size: 28px; margin-bottom: 8px; color: #fff; }
    .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
    .controls { margin-bottom: 24px; display: flex; gap: 12px; align-items: center; }
    .controls button { padding: 10px 20px; border: 1px solid #333; border-radius: 8px; background: #1a1a1a; color: #fff; cursor: pointer; font-size: 14px; transition: all 0.2s; }
    .controls button:hover { background: #2a2a2a; border-color: #555; }
    .controls button.running { background: #1a3a1a; border-color: #4a4; }
    .stats { display: flex; gap: 20px; margin-bottom: 24px; }
    .stat { padding: 16px 24px; border-radius: 12px; border: 1px solid #222; background: #111; min-width: 120px; text-align: center; }
    .stat .num { font-size: 32px; font-weight: 700; }
    .stat .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
    .stat.pass .num { color: #4ade80; }
    .stat.fail .num { color: #f87171; }
    .stat.skip .num { color: #fbbf24; }
    .stat.total .num { color: #60a5fa; }
    .category { margin-bottom: 20px; border: 1px solid #1a1a1a; border-radius: 12px; overflow: hidden; }
    .cat-header { padding: 14px 20px; background: #111; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; }
    .cat-header:hover { background: #181818; }
    .cat-badge { font-size: 12px; padding: 2px 10px; border-radius: 99px; }
    .cat-badge.pass { background: #1a3a1a; color: #4ade80; }
    .cat-badge.fail { background: #3a1a1a; color: #f87171; }
    .cat-body { padding: 0; }
    .test-row { padding: 10px 20px; border-top: 1px solid #1a1a1a; display: flex; gap: 12px; align-items: flex-start; font-size: 13px; }
    .test-row .icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .test-row .name { flex: 1; }
    .test-row .detail { color: #666; font-size: 12px; margin-top: 2px; }
    .test-row.pass .icon { color: #4ade80; }
    .test-row.fail .icon { color: #f87171; }
    .test-row.skip .icon { color: #fbbf24; }
    .iframe-wrap { margin-top: 24px; border: 1px solid #222; border-radius: 12px; overflow: hidden; }
    .iframe-wrap iframe { width: 100%; height: 700px; border: none; background: #000; }
    .iframe-label { padding: 10px 20px; background: #111; font-size: 13px; color: #888; display: flex; justify-content: space-between; }
  </style>
</head>
<body>

  <div class="stats">
    <div class="stat total"><div class="num" id="totalCount">0</div><div class="label">Total</div></div>
    <div class="stat pass"><div class="num" id="passCount">0</div><div class="label">Passed</div></div>
    <div class="stat fail"><div class="num" id="failCount">0</div><div class="label">Failed</div></div>
    <div class="stat skip"><div class="num" id="skipCount">0</div><div class="label">Skipped</div></div>

// ─── TEST RUNNER ─────────────────────────────────────────────────────────────

async function runTests() {
  const btn = document.getElementById("runBtn");
  const statusEl = document.getElementById("status");
  btn.classList.add("running");
  btn.textContent = "⏳ Running...";
  statusEl.textContent = "Loading portfolio...";

  // Wait for iframe to load
  const iframe = document.getElementById("portfolio");
  
  await new Promise((resolve) => {
    if (iframe.contentDocument && iframe.contentDocument.readyState === "complete" && iframe.contentDocument.getElementById("root")) {
      // Wait extra for React to hydrate
      setTimeout(resolve, 6000);
    } else {
      iframe.onload = () => setTimeout(resolve, 6000);
      iframe.src = SITE;
    }
  });

  statusEl.textContent = "Running tests...";

  let doc;
  try {
    doc = iframe.contentDocument || iframe.contentWindow.document;
  } catch (e) {
    statusEl.textContent = "❌ Cannot access iframe (CORS). Open portfolio at localhost:8080 first.";
    btn.classList.remove("running");
    btn.textContent = "▶ Run All Tests";
    return;
  }

  let passed = 0, failed = 0, skipped = 0;
  const categories = {};

  for (const test of results) {
    if (!categories[test.category]) categories[test.category] = [];
    let status, detail = "";
    try {
      const result = await test.fn(doc);
      if (result === true) {
        status = "pass";
        passed++;
      } else if (result === "skip") {
        status = "skip";
        skipped++;
      } else {
        status = "fail";
        failed++;
        detail = typeof result === "string" ? result : "Assertion returned false";
      }
    } catch (e) {
      status = "fail";
      failed++;
      detail = e.message;
    }
    categories[test.category].push({ name: test.name, status, detail });
  }

  // Update stats
  document.getElementById("totalCount").textContent = results.length;
  document.getElementById("passCount").textContent = passed;
  document.getElementById("failCount").textContent = failed;
  document.getElementById("skipCount").textContent = skipped;

  // Render results
  let html = "";
  for (const [cat, tests] of Object.entries(categories)) {
    const catPassed = tests.every(t => t.status === "pass" || t.status === "skip");
    html += `<div class="category">
      <div class="cat-header">
        <span>${cat}</span>
        <span class="cat-badge ${catPassed ? 'pass' : 'fail'}">${catPassed ? '✓ All passed' : '✗ Has failures'}</span>
      </div>
      <div class="cat-body">`;
    for (const t of tests) {
      const icon = t.status === "pass" ? "✓" : t.status === "fail" ? "✗" : "⊘";
      html += `<div class="test-row ${t.status}">
        <span class="icon">${icon}</span>
        <div>
          <div class="name">${t.name}</div>
          ${t.detail ? `<div class="detail">${t.detail}</div>` : ""}
        </div>
      </div>`;
    }
    html += `</div></div>`;
  }

  document.getElementById("results").innerHTML = html;
  statusEl.textContent = `Done — ${passed}/${results.length} passed`;
  btn.classList.remove("running");
  btn.textContent = "▶ Run All Tests";
}
</script>
